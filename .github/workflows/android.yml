name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK is preinstalled on the ubuntu-24.04 runners (ANDROID_HOME); android-actions/setup-android@v3 fails
      # there (sdkmanager 'tools' no longer exists), so it's not used.

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install glslang (shader check)
        run: sudo apt-get install -y glslang-tools

      - name: Check the renderer's GLSL for GLES
        run: python3 android/tools/check_shaders.py glslangValidator

      # The game's data: asm/, assets/ and the executable (the split of the disc) live in a private repo, with a token that can read it
      - name: Get asm/ from the private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/crash-twinsanity-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Copy the game's split into the repo
        run: |
          cp -r private/asm ./asm
          cp -r private/assets ./assets
          cp private/SLES_525.68 ./SLES_525.68

      - name: Install the PS2 toolchain
        run: |
          curl -fsSL -o ps2dev.tar.gz https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-ubuntu-latest.tar.gz
          sudo mkdir -p /opt/ps2dev
          sudo tar -xzf ps2dev.tar.gz -C /opt/ps2dev
          # The compiler's folder is the toolchain's root (ee/bin/..., ps2sdk/...); find it wherever the archive put it
          gxx=$(find /opt/ps2dev -path '*/ee/bin/mips64r5900el-ps2-elf-g++' -print -quit)
          if [ -z "$gxx" ]; then
            echo "The archive has no EE compiler (ee/bin/mips64r5900el-ps2-elf-g++). What it has:"
            find /opt/ps2dev -maxdepth 4 | head -80
            exit 1
          fi
          root=$(dirname "$(dirname "$(dirname "$gxx")")")
          if [ ! -d "$root/ps2sdk" ]; then
            echo "The toolchain at $root has no ps2sdk/. What it has:"
            find "$root" -maxdepth 2 | head -80
            exit 1
          fi
          echo "PS2DEV=$root" >> "$GITHUB_ENV"
          echo "PS2 toolchain at $root"

      - name: Convert the game's data for Android
        run: bash android/tools/gen_data.sh

      - name: Assemble the Android project
        run: bash android/tools/assemble.sh

      # TODO (not in this version): the native library. The game's sources and the touch bridge (src/platform/native/touch)
      # must be built into libmain.so for the NDK's ABIs, and the game data must come from the player's own disc at run time.

      - name: Build the APK
        working-directory: android/build/project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: crash-twinsanity-debug-apk
          path: android/build/project/app/build/outputs/apk/debug/*.apk
